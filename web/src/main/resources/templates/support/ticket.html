<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::messages})}">
<head><title th:text="${ticket.subject}">Conversation</title></head>
<body>
<div id="messages" th:fragment="messages">
    <h1 class="h4 mb-3" th:text="${ticket.subject}"></h1>

    <div class="border rounded p-3 mb-3 bg-body-tertiary" style="max-height:420px;overflow-y:auto">
        <div class="mb-2" th:each="m : ${ticket.messages}">
            <span class="fw-bold" th:text="${m.sender.name() == 'Customer' ? 'You' : (m.sender.name() == 'Admin' ? 'Admin' : 'Assistant')}"></span>
            <span class="text-muted small" th:text="${#temporals.format(m.createdAt, 'd MMM, h:mm a')}"></span>
            <div th:text="${m.content}"></div>
        </div>
    </div>

    <form th:action="@{/support/{id}/send(id=${ticket.id})}" method="post" class="d-flex gap-2">
        <input type="text" name="message" class="form-control" placeholder="Type a message..." required/>
        <button type="submit" class="btn btn-success">Send</button>
    </form>
</div>
</body>
</html>
