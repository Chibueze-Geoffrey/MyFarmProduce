<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Help</title></head>
<body>
<section>
    <h1 class="h3 mb-3">🤖 AI Support</h1>

    <form th:action="@{/support/start}" method="post" class="d-flex gap-2 mb-4">
        <input type="text" name="message" class="form-control" placeholder="How can we help?" required/>
        <button type="submit" class="btn btn-success">Start conversation</button>
    </form>

    <h2 class="h5">Your conversations</h2>
    <p class="text-muted" th:if="${#lists.isEmpty(tickets)}">No conversations yet.</p>
    <ul class="list-group" th:unless="${#lists.isEmpty(tickets)}">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="t : ${tickets}">
            <a th:href="@{/support/{id}(id=${t.id})}" th:text="${t.subject}"></a>
            <span class="badge bg-secondary" th:text="${t.status}"></span>
        </li>
    </ul>
</section>
</body>
</html>
