<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Community chat</title></head>
<body>
<section>
    <h1 class="h3 mb-3">💬 Community Chat</h1>
    <p class="text-muted small">Live chat with other MyFarmProduce shoppers. Be kind. 🌽</p>

    <div id="chatBox" class="border rounded p-3 mb-3 bg-body-tertiary" style="height:420px;overflow-y:auto">
        <div class="mb-2" th:each="m : ${messages}">
            <span class="fw-bold" th:text="${m.senderName}"></span>
            <span class="text-muted small" th:text="${#temporals.format(m.createdAt, 'd MMM, h:mm a')}"></span>
            <div th:text="${m.content}"></div>
        </div>
    </div>

    <form id="chatForm" class="d-flex gap-2">
        <input id="chatInput" class="form-control" placeholder="Type a message..." autocomplete="off" maxlength="2000" required/>
        <button type="submit" id="chatSend" class="btn btn-success" disabled>Send</button>
    </form>
    <div id="chatStatus" class="text-muted small mt-2">Connecting…</div>

    <script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
    <script th:inline="javascript">
        const box = document.getElementById('chatBox');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('chatSend');
        const status = document.getElementById('chatStatus');
        box.scrollTop = box.scrollHeight;

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        const socket = new SockJS(/*[[@{/ws/chat}]]*/ '/ws/chat');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            status.textContent = 'Connected.';
            sendBtn.disabled = false;
            stompClient.subscribe('/topic/chat', (frame) => {
                const msg = JSON.parse(frame.body);
                const div = document.createElement('div');
                div.className = 'mb-2';
                div.innerHTML = `<span class="fw-bold">${escapeHtml(msg.senderName)}</span> <span class="text-muted small">${escapeHtml(msg.time)}</span><div>${escapeHtml(msg.content)}</div>`;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            });
        }, () => {
            status.textContent = 'Connection failed. Reload to retry.';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if (!msg || !stompClient.connected) return;
            stompClient.send('/app/chat.send', {}, JSON.stringify({ content: msg }));
            input.value = '';
        });
    </script>
</section>
</body>
</html>
