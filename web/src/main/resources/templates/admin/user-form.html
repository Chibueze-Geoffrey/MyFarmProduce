<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${form.id} != null ? 'Edit user' : 'New user'">User</title></head>
<body>
<section>
    <h1 class="h3 mb-3" th:text="${form.id} != null ? 'Edit user' : 'New user'"></h1>

    <form th:action="${form.id} != null ? @{/admin/users/{id}/edit(id=${form.id})} : @{/admin/users/create}"
          th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <p class="text-muted small" th:unless="${form.id}">
            New users get the default password and are prompted to change it on first login.
        </p>
        <button type="submit" class="btn btn-success">Save</button>
    </form>
</section>
</body>
</html>
