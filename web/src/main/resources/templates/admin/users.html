<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Users</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Users</h1>
        <a th:href="@{/admin/users/create}" class="btn btn-success">+ New user</a>
    </div>

    <form method="get" class="d-flex mb-3">
        <input type="search" name="q" th:value="${search}" class="form-control me-2" placeholder="Search name or email..."/>
        <button type="submit" class="btn btn-outline-secondary">Search</button>
    </form>

    <table class="table align-middle">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.phone}"></td>
            <td class="d-flex gap-1">
                <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
