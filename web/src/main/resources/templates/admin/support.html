<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Support tickets</title></head>
<body>
<section>
    <h1 class="h3 mb-3">Support Tickets</h1>

    <table class="table align-middle">
        <thead><tr><th>Customer</th><th>Subject</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${tickets}">
            <td th:text="${t.customer.name}"></td>
            <td th:text="${t.subject}"></td>
            <td><span class="badge bg-secondary" th:text="${t.status}"></span></td>
            <td><a th:href="@{/admin/support/{id}(id=${t.id})}" class="btn btn-sm btn-outline-secondary">View</a></td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
