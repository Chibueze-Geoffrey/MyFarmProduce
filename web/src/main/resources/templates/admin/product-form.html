<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${form.id} != null ? 'Edit product' : 'New product'">Product</title></head>
<body>
<section>
    <h1 class="h3 mb-3" th:text="${form.id} != null ? 'Edit product' : 'New product'"></h1>

    <form th:action="${form.id} != null ? @{/admin/products/{id}/edit(id=${form.id})} : @{/admin/products/create}"
          th:object="${form}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{categoryId}" class="form-select">
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Unit</label>
            <select th:field="*{unit}" class="form-select">
                <option th:each="u : ${T(com.myfarmproduce.domain.enums.ProductUnit).values()}" th:value="${u}" th:text="${u}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Stock quantity</label>
            <input type="number" th:field="*{stockQty}" class="form-control"/>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{available}" class="form-check-input"/>
            <label class="form-check-label">Available for purchase</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" name="imageFile" class="form-control" accept="image/*"/>
            <input type="hidden" th:field="*{imageUrl}"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
    </form>
</section>
</body>
</html>
