<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Products</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Products</h1>
        <a th:href="@{/admin/products/create}" class="btn btn-success">+ New product</a>
    </div>

    <table class="table align-middle">
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Available</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.category.name}"></td>
            <td>₦<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></span></td>
            <td th:text="${p.stockQty}"></td>
            <td>
                <span class="badge" th:classappend="${p.available} ? 'bg-success' : 'bg-secondary'"
                      th:text="${p.available} ? 'Yes' : 'No'"></span>
            </td>
            <td class="d-flex gap-1">
                <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <form th:action="@{/admin/products/{id}/restock(id=${p.id})}" method="post" class="d-flex gap-1">
                    <input type="number" name="quantity" class="form-control form-control-sm" style="width:70px" min="1" placeholder="qty"/>
                    <button type="submit" class="btn btn-sm btn-outline-success">Restock</button>
                </form>
                <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
