<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${ticket.subject}">Conversation</title></head>
<body>
<section>
    <h1 class="h4 mb-1" th:text="${ticket.subject}"></h1>
    <p class="text-muted small" th:text="${ticket.customer.name} + ' (' + ${ticket.customer.email} + ')'"></p>

    <div class="border rounded p-3 bg-body-tertiary" style="max-height:420px;overflow-y:auto">
        <div class="mb-2" th:each="m : ${ticket.messages}">
            <span class="fw-bold" th:text="${m.sender}"></span>
            <span class="text-muted small" th:text="${#temporals.format(m.createdAt, 'd MMM, h:mm a')}"></span>
            <div th:text="${m.content}"></div>
        </div>
    </div>
</section>
</body>
</html>
