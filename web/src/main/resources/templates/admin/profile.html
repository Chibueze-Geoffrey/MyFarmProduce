<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Admin profile</title></head>
<body>
<section>
    <h1 class="h3 mb-3">My Profile</h1>
    <img th:if="${admin.photoUrl}" th:src="${admin.photoUrl}" class="rounded-circle mb-3" style="width:96px;height:96px;object-fit:cover"/>
    <form th:action="@{/admin/profile}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" th:value="${admin.name}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Photo</label>
            <input type="file" name="photoFile" class="form-control" accept="image/*"/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
    </form>
    <p class="text-muted small mt-3">Email: <span th:text="${admin.email}"></span></p>
</section>
</body>
</html>
