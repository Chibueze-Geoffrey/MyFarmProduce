<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Your cart</title></head>
<body>
<section>
    <h1 class="h3 mb-3">Your Cart</h1>

    <p class="text-muted" th:if="${cart.empty}">Your cart is empty. <a th:href="@{/catalog}">Browse produce</a>.</p>

    <div th:unless="${cart.empty}">
        <div class="alert alert-warning" th:if="${cart.hasStockIssues}">
            Some items exceed available stock. Please adjust quantities below.
        </div>

        <table class="table align-middle">
            <thead><tr><th>Product</th><th>Price</th><th style="width:120px">Quantity</th><th>Line total</th><th></th></tr></thead>
            <tbody>
            <tr th:each="line : ${cart.lines}" th:classappend="${line.exceedsStock} ? 'table-danger' : ''">
                <td th:text="${line.product.name}"></td>
                <td>₦<span th:text="${#numbers.formatDecimal(line.product.price, 1, 'COMMA', 2, 'POINT')}"></span></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex gap-1">
                        <input type="hidden" name="productId" th:value="${line.product.id}"/>
                        <input type="number" name="quantity" th:value="${line.quantity}" min="0" class="form-control form-control-sm"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Update</button>
                    </form>
                </td>
                <td>₦<span th:text="${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')}"></span></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="productId" th:value="${line.product.id}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="row justify-content-end">
            <div class="col-md-4">
                <p class="d-flex justify-content-between">
                    <span>Subtotal</span>
                    <span>₦<span th:text="${#numbers.formatDecimal(cart.subtotal, 1, 'COMMA', 2, 'POINT')}"></span></span>
                </p>
                <p class="d-flex justify-content-between">
                    <span>Delivery fee</span>
                    <span>₦<span th:text="${#numbers.formatDecimal(cart.deliveryFee, 1, 'COMMA', 2, 'POINT')}"></span></span>
                </p>
                <p class="d-flex justify-content-between fw-bold">
                    <span>Total</span>
                    <span>₦<span th:text="${#numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT')}"></span></span>
                </p>
                <a th:href="@{/checkout}" class="btn btn-success w-100" th:classappend="${cart.hasStockIssues} ? 'disabled' : ''">Checkout</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
