<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Change password</title></head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-3">Change your password</h1>
            <p class="text-muted small">Your account was created with a default password. Please set a new one to continue.</p>
            <form th:action="@{/account/change-password}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" th:field="*{newPassword}" class="form-control"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-success">Change password</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
