<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Shop</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Fresh Farm Produce</h1>
        <form method="get" class="d-flex" role="search">
            <input class="form-control me-2" type="search" name="q" th:value="${search}" placeholder="Search produce..."/>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(categories)}">
        No products found<span th:if="${search}" th:text="' for &quot;' + ${search} + '&quot;.'"></span>
        <span th:unless="${search}">.</span>
    </p>

    <section class="mb-5" th:each="category : ${categories}">
        <h2 class="h4 border-bottom pb-2" th:text="${category.name}"></h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
            <div class="col" th:each="product : ${category.products}">
                <div class="card h-100" th:classappend="${!product.available || product.stockQty <= 0} ? 'opacity-75' : ''">
                    <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}"
                         style="height:160px;object-fit:cover"/>
                    <div th:unless="${product.imageUrl}" class="bg-light d-flex align-items-center justify-content-center" style="height:160px">
                        <span class="display-6">🧺</span>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h3 class="h6">
                            <a class="text-decoration-none text-dark" th:href="@{/catalog/{id}(id=${product.id})}" th:text="${product.name}"></a>
                        </h3>
                        <p class="mb-1 fw-bold">
                            ₦<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></span>
                            <small class="text-muted fw-normal">/ <span th:text="${product.unit}"></span></small>
                        </p>
                        <span th:if="${!product.available || product.stockQty <= 0}" class="badge bg-secondary mb-2">Out of stock</span>
                        <span th:unless="${!product.available || product.stockQty <= 0}" class="badge bg-success mb-2"
                              th:text="'In stock (' + ${product.stockQty} + ')'"></span>
                        <div class="mt-auto" sec:authorize="!hasRole('ADMIN')">
                            <form th:action="@{/cart/add}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="productId" th:value="${product.id}"/>
                                <input type="hidden" name="returnUrl" th:value="@{/catalog}"/>
                                <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQty}"
                                       class="form-control form-control-sm" style="width:70px"
                                       th:disabled="${!product.available || product.stockQty <= 0}"/>
                                <button type="submit" class="btn btn-sm btn-success flex-grow-1"
                                        th:disabled="${!product.available || product.stockQty <= 0}">Add</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</section>
</body>
</html>
