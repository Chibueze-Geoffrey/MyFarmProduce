<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>My orders</title></head>
<body>
<section>
    <h1 class="h3 mb-3">My Orders</h1>
    <p class="text-muted" th:if="${#lists.isEmpty(orders)}">You haven't placed any orders yet.</p>

    <table class="table" th:unless="${#lists.isEmpty(orders)}">
        <thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>#<span th:text="${order.id}"></span></td>
            <td th:text="${#temporals.format(order.createdAt, 'd MMM yyyy')}"></td>
            <td><span class="badge bg-secondary" th:text="${order.status}"></span></td>
            <td>₦<span th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></span></td>
            <td>
                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-secondary">Details</a>
                <form th:action="@{/orders/{id}/reorder(id=${order.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-success">Reorder</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
