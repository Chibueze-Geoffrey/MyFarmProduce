spring.application.name=myfarmproduce

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myfarmproduce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:myfarmproduce}

spring.flyway.enabled=true
# Dedicated schema rather than "public" - the deployed Postgres instance is
# shared with other apps (Render free-tier allows one free DB per account),
# so this avoids table-name collisions and Flyway's "non-empty schema, no
# history table" refusal. Flyway creates the schema if it doesn't exist yet.
spring.flyway.schemas=${DB_SCHEMA:myfarmproduce}
spring.flyway.default-schema=${DB_SCHEMA:myfarmproduce}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=${APP_UPLOAD_DIR:uploads}

spring.thymeleaf.cache=true

server.error.whitelabel.enabled=false
