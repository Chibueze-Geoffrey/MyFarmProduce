services:
  - type: web
    name: myfarmproduce
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Same env var (name + postgres:// URI format) the previous .NET/Npgsql
      # deployment used. The app parses it into the JDBC connection Spring
      # needs internally (see DatabaseUrlEnvironmentPostProcessor) - no
      # dashboard changes needed if it's already set from the old deploy.
      - key: ConnectionStrings__DefaultConnection
        sync: false
