services:
  - type: web
    name: myfarmproduce
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # No database is declared here — Render's free tier allows only one
      # active free Postgres instance per account. Point this at your
      # existing database's connection string (Npgsql 6.0+ accepts Render's
      # URI-style connection string directly) via the dashboard.
      - key: ConnectionStrings__DefaultConnection
        sync: false
